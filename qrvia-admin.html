<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>QRVİA | Lisans Yönetimi</title><style>:root{font-family:system-ui,Arial,sans-serif;background:#f7f7f8;color:#222}*{box-sizing:border-box}body{margin:0}header{background:#192e2a;color:white;padding:22px 18px}header div,main{max-width:760px;margin:auto}h1{margin:0;font-size:25px}header p{margin:5px 0 0;color:#d6e8df}main{padding:20px 15px 50px}.card{background:white;border:1px solid #e5e7e7;border-radius:16px;padding:20px;margin:14px 0;box-shadow:0 4px 15px #00000008}label{display:block;font-size:14px;font-weight:650;margin:13px 0 6px}input{width:100%;border:1px solid #cdd4d1;border-radius:9px;padding:13px;font:inherit}button{background:#146b52;color:white;border:0;border-radius:9px;padding:12px 16px;font:inherit;font-weight:700;cursor:pointer}button:disabled{opacity:.6}button.alt{background:#e8eeeb;color:#184f3f}.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.row>*{flex:1}.hidden{display:none!important}.muted{color:#68736d}.status{padding:12px;border-radius:10px;background:#edf4f1;margin:15px 0}.error{background:#fff0f0;color:#9c2020}.big{font-size:22px;font-weight:750}.license{border-top:1px solid #e9eeee;padding:17px 0}.license:first-child{border-top:0}.stats{display:grid;grid-template-columns:1fr 1fr;gap:12px}.stats div{background:#f4f7f5;border-radius:10px;padding:12px}.stats small{display:block;color:#65766c;margin-bottom:4px}.warn{color:#a34d00}</style></head><body><header><div><h1>QRVİA</h1><p>Merkezi Lisans Yönetimi</p></div></header><main><div id="message" class="status">Giriş durumu kontrol ediliyor…</div><section id="login" class="card hidden"><h2>Yönetici Girişi</h2><label for="email">E-posta</label><input id="email" type="email" autocomplete="username"><label for="password">Şifre</label><input id="password" type="password" autocomplete="current-password"><p><button id="signin">Giriş Yap</button></p></section><section id="panel" class="hidden"><div class="row"><h2>Lisanslar</h2><button id="refresh" class="alt">Yenile</button><button id="logout" class="alt">Çıkış</button></div><div id="licenses" class="card">Lisanslar yükleniyor…</div><p class="muted">Lisans yenileme işlemi veritabanında yetkili hesapla gerçekleştirilir. Ödeme kaydını ayrıca takip edin.</p></section></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script><script>(()=>{'use strict';const db=window.supabase.createClient('https://vcpfxdqvphdqqyagtwmh.supabase.co','sb_publishable_sTo_fxSQ2SiJjIoJIS3oIg_6dg18KdS');const $=id=>document.getElementById(id);const msg=(s,e=false)=>{$('message').textContent=s;$('message').className='status'+(e?' error':'')};const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const date=s=>new Date(s).toLocaleDateString('tr-TR',{year:'numeric',month:'long',day:'numeric',timeZone:'Europe/Istanbul'});let licenses=[];async function load(){const {data,error}=await db.rpc('qrvia_list_licenses');if(error){msg('Lisans listesi alınamadı: '+error.message,true);return}licenses=data||[];$('licenses').innerHTML=licenses.length?licenses.map((l,i)=>{const end=new Date(l.expires_at),grace=new Date(end.getTime()+Number(l.grace_days)*86400000),now=Date.now(),remaining=Math.max(0,Math.ceil((grace-now)/86400000)),state=now>=grace?'Süresi doldu':now>=end?'Ek sürede':'Aktif';return '<div class="license"><h3>'+esc(l.name)+'</h3><div class="stats"><div><small>Başlangıç</small>'+date(l.starts_at)+'</div><div><small>Bitiş</small>'+date(l.expires_at)+'</div><div><small>Durum</small><strong class="'+(state==='Aktif'?'':'warn')+'">'+state+'</strong></div><div><small>Ek süre dahil kalan</small>'+remaining+' gün</div><div><small>Ek süre sonu</small>'+date(grace)+'</div><div><small>Yenileme bedeli</small>'+Number(l.renewal_fee).toLocaleString('tr-TR')+' ₺</div></div><p><button data-renew="'+i+'">9 Ay Yenile</button></p></div>'}).join(''):'Henüz lisans kaydı bulunmuyor.';msg('Lisans bilgileri güncel.')}async function check(){const {data}=await db.auth.getSession();const logged=!!data.session;$('login').classList.toggle('hidden',logged);$('panel').classList.toggle('hidden',!logged);if(logged)await load();else msg('Lütfen QRVİA yönetici hesabınızla giriş yapın.')} $('signin').onclick=async()=>{const {error}=await db.auth.signInWithPassword({email:$('email').value.trim(),password:$('password').value});if(error)return msg(error.message,true);$('password').value='';await check()};$('logout').onclick=async()=>{await db.auth.signOut();await check()};$('refresh').onclick=load;$('licenses').onclick=async e=>{const b=e.target.closest('button[data-renew]');if(!b)return;const l=licenses[Number(b.dataset.renew)];if(!l)return;if(!confirm(l.name+' için 9 aylık lisans yenilemesi yapılsın mı? Bu işlem geri alınamaz.'))return;b.disabled=true;const {error}=await db.rpc('qrvia_renew_license',{p_restaurant_id:l.restaurant_id});b.disabled=false;if(error)return msg('Yenileme başarısız: '+error.message,true);await load();msg(l.name+' lisansı 9 ay yenilendi.')};check()})();</script></body></html>
